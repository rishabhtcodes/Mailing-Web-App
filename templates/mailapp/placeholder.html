{% extends 'base.html' %}

{% block title %}{{ title }} - Mailing{% endblock %}

{% block content %}
<div class="flex-1 bg-white border border-gray-200/70 rounded-2xl p-8 flex flex-col items-center justify-center text-center shadow-xs">
    <div class="w-16 h-16 rounded-2xl bg-gray-100 text-gray-800 flex items-center justify-center font-bold text-2xl mb-4">
        ⚡
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">{{ title }}</h1>
    <p class="text-xs text-gray-500 max-w-sm mb-6">This section is ready for extension. All email dispatch and inbox features are active in your Inbox tab.</p>
    <a href="{% url 'mailapp:inbox' %}" class="btn-primary">
        Go to Inbox →
    </a>
</div>
{% endblock %}
